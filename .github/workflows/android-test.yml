# TEMPORARY: runs release.yml's android job's steps on pushes to this branch, uploading the APK and
# .aab as an artifact instead of attaching them to a release. Removed before the pull request merges.
name: Android release build (test)

on:
  push:
    branches: [feat/android-apk]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: version
        run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Java 17 and the NDK, which the runner has (the Android SDK is at $ANDROID_HOME)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Rust, for each kind of Android processor
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: android
      - run: bun install --frozen-lockfile
      - name: OpenSCAD, which the app includes for 3D models made from code
        run: bun run openscad-assets
      - name: The signing key, from the repository's secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/lines-android.jks"
          {
            echo "keyAlias=lines"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/lines-android.jks"
          } > src-tauri/gen/android/keystore.properties
      - name: Build
        run: bun run tauri android build --apk --aab
        env:
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          VITE_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VITE_MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      - name: Signed with lines' key, and only it
        run: bun scripts/release.mjs check-android-signatures src-tauri/gen/android/app/build/outputs
      - name: Name the downloads by the system they're for
        run: bun scripts/release.mjs name-downloads "${{ steps.version.outputs.version }}" src-tauri/gen/android
      - name: What would be attached
        run: find src-tauri/gen/android/app/build/outputs -type f -name "lines_*_android_*" \( -name '*.apk' -o -name '*.aab' \) -exec ls -la {} +
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/lines_*
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/lines_*
          if-no-files-found: error
          retention-days: 5
