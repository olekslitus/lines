# The browser tests, over and over: a test that fails now and then (a flaky one) shows here, every
# night, rather than on someone's pull request. Each browser runs the suite several times on a runner
# of its own, and again on one kept busy, as a loaded runner or a slow phone is. A failure fails the
# run and is noted, with the run's link, in an issue titled "Flaky browser tests" (opened again if it
# was closed), so it isn't missed. It doesn't hold up pull requests: checks.yml runs the suite once
# there.
name: Flakes

on:
  schedule:
    - cron: "23 6 * * *"
  # By hand, from the Actions tab, on any branch: a fix for a flaky test, run as many times as it takes.
  workflow_dispatch:
    inputs:
      runs:
        description: Times each runner runs the suite
        default: "3"
  # And on a pull request that changes this file, so a change to it is seen to work.
  pull_request:
    paths: [.github/workflows/flakes.yml]

permissions:
  contents: read

concurrency:
  group: flakes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: browsers (${{ matrix.browser }}, ${{ matrix.load }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        load: [idle, busy]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: The browser tests, ${{ inputs.runs || 3 }} times
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          RUNS: ${{ inputs.runs || 3 }}
          BUSY: ${{ matrix.load == 'busy' }}
        run: |
          # Busy: two of the runner's four CPUs kept turning, so the page and the tests wait on each other.
          if [ "$BUSY" = true ]; then for _ in 1 2; do (while :; do :; done) & done; fi
          failed=0
          for run in $(seq 1 "$RUNS"); do
            if ! bun run test:browser > run.txt 2>&1; then
              failed=1
              grep -E '^\(fail\)' run.txt | sort -u | sed "s/^(fail) /run $run: /" | tee -a failures.txt
              cp run.txt "run-$run.txt"
            fi
            # Built once; the runs after use that build.
            export LINES_TEST_BUILD=0
          done
          if [ "$failed" = 1 ]; then
            { echo "### ${BROWSER}, ${{ matrix.load }}: failed"; echo; sed 's/^/- /' failures.txt; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ${BROWSER}, ${{ matrix.load }}: ${RUNS} runs, every test passed" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-${{ matrix.browser }}-${{ matrix.load }}
          path: |
            failures.txt
            run-*.txt

  # A failure, noted where it's seen: in the issue for flaky tests, opened if there isn't one.
  report:
    needs: browsers
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failures-*
      - name: Note the failures in the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Tonight's [run]($RUN) failed:"
            echo
            for dir in failures-*; do
              echo "**${dir#failures-}**"
              sed 's/^/- /' "$dir/failures.txt"
              echo
            done
          } > body.md
          issue=$(gh issue list --state all --search 'in:title "Flaky browser tests"' --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            gh issue create --title "Flaky browser tests" --body-file body.md
          else
            gh issue reopen "$issue" || true
            gh issue comment "$issue" --body-file body.md
          fi
