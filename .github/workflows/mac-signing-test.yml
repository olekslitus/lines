# TEMPORARY, removed before merging: release.yml's macOS build, signing and checks, run on this
# branch's pushes, with the app launched on the runner and the signed app kept as an artifact.
name: Mac signing test

on:
  push:
    branches: [build/sign-mac-app]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run tex-assets
      - run: bun run openscad-assets
      - name: The Mac app's certificate, and the key it's notarized with
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE isn't in the repository's secrets, so the Mac app can't be signed."
            exit 1
          fi
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notarization-key.p8"
            echo "NOTARIZE=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Not notarized::The Mac app is signed but not notarized: APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_PRIVATE_KEY aren't all in the repository's secrets."
          fi
      - name: Build
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do
            [ -n "${!name}" ] || unset "$name"
          done
          bun run tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ env.NOTARIZE && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ env.NOTARIZE && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.NOTARIZE && format('{0}/notarization-key.p8', runner.temp) || '' }}
      - name: Notarize the .dmg
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notarization-key.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done
      - name: Signed with Lines' Developer ID, and notarized if it could be
        run: bun scripts/release.mjs check-mac-signature src-tauri/target ${NOTARIZE:+notarized}
      - name: What codesign and Gatekeeper say
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Lines.app
          codesign -dvvv --entitlements - "$app" 2>&1
          codesign -d -r- "$app" 2>&1
          for arch in arm64 x86_64; do codesign -dvv --arch "$arch" "$app" 2>&1 | grep -E 'Format|flags|Timestamp'; done
          spctl -a -vv -t exec "$app" 2>&1 || true
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do codesign -dvv "$dmg" 2>&1; spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1 || true; done
      - name: Launch the signed app on the runner
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Lines.app
          ls "$app/Contents/MacOS"
          HOME="$(mktemp -d)" "$app/Contents/MacOS/lines" > "$RUNNER_TEMP/lines.log" 2>&1 &
          pid=$!
          sleep 30
          ps -o pid,stat,etime,command -p "$pid" || { echo "::error::Lines quit"; cat "$RUNNER_TEMP/lines.log"; exit 1; }
          pgrep -fl WebKit || true
          screencapture -x "$RUNNER_TEMP/screen-1.png" || true
          cat > "$RUNNER_TEMP/click.applescript" <<'EOF'
          -- Clicks the first thing in Lines' window named, described or titled argv's second item.
          on run argv
            set pid to (item 1 of argv) as integer
            set label to item 2 of argv
            tell application "System Events"
              tell (first process whose unix id is pid)
                set frontmost to true
                repeat with e in (entire contents of window 1)
                  try
                    if name of e is label or description of e is label or title of e is label then
                      click e
                      return "clicked " & label
                    end if
                  end try
                end repeat
              end tell
            end tell
            return "no " & label
          end run
          EOF
          keys() { osascript -e "tell application \"System Events\" to tell (first process whose unix id is $pid) to set frontmost to true" -e "tell application \"System Events\" to $1" || true; }
          # A 3D model (OpenSCAD's WebAssembly, WebGL), from /model in a new note.
          keys 'keystroke "n" using command down'; sleep 3
          keys 'keystroke "/model"'; sleep 2
          keys 'key code 36'; sleep 30
          screencapture -x "$RUNNER_TEMP/screen-2.png" || true
          # A LaTeX note, typeset with TeX (BusyTeX's WebAssembly).
          keys 'keystroke "n" using command down'; sleep 3
          keys 'keystroke "Signed and hardened"'; keys 'key code 36'; keys 'keystroke "Typeset by TeX in the signed app."'; sleep 2
          osascript "$RUNNER_TEMP/click.applescript" "$pid" "Note info" || true; sleep 3
          osascript "$RUNNER_TEMP/click.applescript" "$pid" "LaTeX" || true; sleep 3
          screencapture -x "$RUNNER_TEMP/screen-3.png" || true
          keys 'key code 53'; sleep 1
          keys 'keystroke "p" using command down'; sleep 5
          osascript "$RUNNER_TEMP/click.applescript" "$pid" "TeX" || true; sleep 90
          screencapture -x "$RUNNER_TEMP/screen-4.png" || true
          ps -o pid,stat,etime,command -p "$pid" || { echo "::error::Lines quit"; cat "$RUNNER_TEMP/lines.log"; exit 1; }
          kill "$pid"
          cat "$RUNNER_TEMP/lines.log"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i lines && exit 1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-mac-app
          retention-days: 3
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            ${{ runner.temp }}/screen-*.png
