# Releases lines when its release pull request is merged (release-pr.yml): tags the version, builds
# the desktop apps on macOS, Windows and Linux and the Android app, attaches them and the desktop
# apps' signed update packages to a GitHub release with the version's notes from CHANGELOG.md, adds
# the update manifest the apps check, publishes it, and deploys the website again for its downloads. docs/releasing.md has the
# whole process.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: version
        run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Tag it, and draft its release with its notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Whether the Mac app will be notarized, as the build job does when it has the key.
          NOTARIZED: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Lines is in alpha: early and changing. Export your notes now and then (Settings → Data → Export)."
            echo
            if [ "$NOTARIZED" = true ]; then
              echo "The Mac app is signed with Lines' Developer ID and notarized by Apple, so it opens like any other app. The Windows app isn't signed yet: choose More info → Run anyway."
            else
              echo "The Mac app is signed with Lines' Developer ID but not yet notarized by Apple: if macOS says it can't verify Lines is free of malware, open it once from System Settings → Privacy & Security → Open Anyway. The Windows app isn't signed yet: choose More info → Run anyway."
            fi
            echo
            echo "On Android, download the \`.apk\` on the phone and open it; allow your browser or Files app to install apps when asked. It doesn't update itself yet: install a newer one over it, and your notes stay. The \`.aab\` is the same app for Google Play, not for installing."
            echo
            bun scripts/release.mjs notes "$VERSION"
          } > "$notes"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --draft --verify-tag --title "Lines $VERSION" --notes-file "$notes"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for Apple silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          # The oldest Ubuntu the AppImage should still run on.
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: TeX, which the desktop apps include for LaTeX notes' PDFs
        run: bun run tex-assets
      - name: OpenSCAD, which the apps include for 3D models made from code
        run: bun run openscad-assets
      # The Mac app is signed with Lines' Developer ID, and notarized once the repository has an App
      # Store Connect key; without one it's signed alone (docs/releasing.md#the-mac-apps-signature).
      - name: The Mac app's certificate, and the key it's notarized with
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE isn't in the repository's secrets, so the Mac app can't be signed."
            exit 1
          fi
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notarization-key.p8"
            echo "NOTARIZE=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Not notarized::The Mac app is signed but not notarized: APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_PRIVATE_KEY aren't all in the repository's secrets."
          fi
      - name: Build
        # With the packages the apps update themselves from, each signed (a .sig beside it).
        shell: bash
        run: |
          # Tauri takes a variable that's there but empty as given, and would notarize with nothing.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do
            [ -n "${!name}" ] || unset "$name"
          done
          bun run tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          # Unsplash's and GIPHY's keys for /unsplash and /giphy; without them those plugins are off.
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          # lines' client ids on AniList and MyAnimeList, for keeping lists in step; without them that's off.
          VITE_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VITE_MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          # The key whose public half is in tauri.conf.json; the apps install only what it signed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Mac app's Developer ID certificate, which Tauri imports into a keychain of its own to
          # sign the app with (the hardened runtime, a secure timestamp) and then the .dmg; and the
          # key it notarizes the app with and staples the ticket to it before the .dmg and the
          # update package are made of it.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ env.NOTARIZE && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ env.NOTARIZE && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.NOTARIZE && format('{0}/notarization-key.p8', runner.temp) || '' }}
      # Tauri notarizes the app but not the .dmg it's in; with the .dmg's own ticket stapled to it,
      # macOS doesn't have to ask Apple about it when it's opened.
      - name: Notarize the .dmg
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notarization-key.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done
      - name: Signed with Lines' Developer ID, and notarized if it could be
        if: runner.os == 'macOS'
        run: bun scripts/release.mjs check-mac-signature src-tauri/target ${NOTARIZE:+notarized}
      - name: Name the downloads by the system they're for, lines_0.3.3_macos_universal.dmg
        shell: bash
        run: bun scripts/release.mjs name-downloads "$VERSION" src-tauri/target
      - name: Attach the installers and update packages to the release
        shell: bash
        run: |
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | xargs -0 gh release upload "v$VERSION" --clobber

  # The Android app: an APK to install from the release, for every kind of Android device, and the
  # same app as an .aab for Google Play later, both signed with lines' Android key.
  android:
    needs: tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Java 17 and the NDK, which the runner has (the Android SDK is at $ANDROID_HOME)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Rust, for each kind of Android processor
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: android
      - run: bun install --frozen-lockfile
      # TeX is left out: Tauri builds the app's pages into the native library, once for each kind of
      # processor, so its 120 MB would be in the APK four times (docs/releasing.md#android).
      - name: OpenSCAD, which the app includes for 3D models made from code
        run: bun run openscad-assets
      # Where the key is, for app/build.gradle.kts (Tauri's Android signing guide). Its alias, `lines`,
      # isn't read from a secret: a job given one hides the word everywhere in its log.
      - name: The signing key, from the repository's secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/lines-android.jks"
          {
            echo "keyAlias=lines"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/lines-android.jks"
          } > src-tauri/gen/android/keystore.properties
      - name: Build
        run: bun run tauri android build --apk --aab
        env:
          # The same services' keys as the desktop apps'.
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          VITE_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VITE_MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      - name: Signed with Lines' key, and only it
        run: bun scripts/release.mjs check-android-signatures src-tauri/gen/android/app/build/outputs
      - name: Name the downloads by the system they're for, lines_0.3.3_android_universal.apk
        run: bun scripts/release.mjs name-downloads "$VERSION" src-tauri/gen/android
      - name: Attach the APK and the app bundle to the release
        run: |
          find src-tauri/gen/android/app/build/outputs -type f -name "lines_${VERSION}_android_*" \( -name '*.apk' -o -name '*.aab' \) \
            -print0 | xargs -0 gh release upload "v$VERSION" --clobber

  publish:
    needs: [tag, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To deploy the website again (website.yml).
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Add the update manifest the apps check (latest.json)
        run: |
          gh release download "v$VERSION" --pattern '*.sig' --dir "$RUNNER_TEMP/signatures"
          bun scripts/release.mjs manifest "$VERSION" "$RUNNER_TEMP/signatures" > "$RUNNER_TEMP/latest.json"
          gh release upload "v$VERSION" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish the release
        run: gh release edit "v$VERSION" --draft=false
      # A release published with this workflow's token starts no workflow by itself; a dispatch does.
      - name: Offer its downloads on the website
        run: gh workflow run website.yml --ref main
