[package]
name = "lines"
version = "0.7.0"
description = "Beautiful, simple, local-first notes"
authors = ["Lines contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/olekslitus/lines"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lines_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# Any header a request in a note sets is sent (http plugin), Origin and Cookie included. Its TLS is
# rustls everywhere but on iPhone and iPad, where it's Apple's (Security.framework, through
# native-tls): the App Store's export compliance then finds no encryption but the system's, as the
# notes' own is WebKit's Web Crypto (Info.plist's ITSAppUsesNonExemptEncryption).
[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

# Updates from GitHub's releases (src/updates.rs); phones update from their stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
semver = "1"
time = { version = "0.3", features = ["parsing", "serde"] }

# The folder picker for cloud drive sync on Windows and Linux; the Mac's is AppKit's (src/folder_sync.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2.8.4"

# The installed fonts, from DirectWrite (src/fonts.rs): the version Tauri's windows already use.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

# SF Symbols are drawn by the OS at runtime (see src/sf_symbols.rs).
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
security-framework = "3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

# A tick as a pull down is far enough to refresh (src/lib/haptics.ts).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.4.2"

[target.'cfg(target_os = "ios")'.dependencies]
# Apple's TLS for the http plugin (see its line above).
tauri-plugin-http = { version = "2", default-features = false, features = ["unsafe-headers", "native-tls", "http2", "charset", "system-proxy", "cookies"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-ui-kit = "0.3"
block2 = "0.6"

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
